services:
  db:
    image: postgres:15
    container_name: pinggo_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    image: redis:7
    container_name: pinggo_redis
    restart: always
    volumes:
      - redis_data:/data

  web:
    image: dubeysumit/pinggo:v.1.5
    container_name: pinggo_web
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.25
    container_name: pinggo_nginx
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  static_volume:
  redis_data: